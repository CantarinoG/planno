services:
  frontend:
    build: ./frontend
    ports:
      - "5174:4173"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:8080"
    depends_on:
      - mongo
      - kafka

  mongo:
    image: mongo:7

  kafka:
    image: confluentinc/confluent-local:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'